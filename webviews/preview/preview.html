<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WPF Interactive Preview</title>
    <link rel="stylesheet" href="preview.css">
</head>
<body>
    <div class="preview-container">
        <div class="preview-toolbar">
            <div class="toolbar-left">
                <button id="refreshBtn" class="toolbar-btn" title="Refresh Preview">
                    <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"></path><path d="M21 3v5h-5"></path></svg>
                    Refresh
                </button>
                <button id="modeBtn" class="toolbar-btn" title="Toggle Mode">
                    <svg viewBox="0 0 24 24"><path d="m13 2-2 10h9L11 22l2-10H4L13 2z"></path></svg>
                    <span id="modeLabel">FastLive</span>
                </button>
            </div>
            <div class="toolbar-right">
                <div class="zoom-controls">
                    <button id="zoomOutBtn" class="toolbar-btn" title="Zoom Out">
                        <svg viewBox="0 0 24 24"><path d="M5 12h14"></path></svg>
                    </button>
                    <span id="zoomLabel">100%</span>
                    <button id="zoomInBtn" class="toolbar-btn" title="Zoom In">
                        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"></path></svg>
                    </button>
                </div>
            </div>
        </div>
        
        <div class="preview-content" id="previewContent">
            <div class="preview-image-container" id="imageContainer">
                <img id="previewImage" alt="XAML Preview" />
                <canvas id="overlayCanvas"></canvas>
            </div>
            <div class="preview-loading" id="loadingIndicator">
                <div class="spinner"></div>
                <p>Rendering preview...</p>
            </div>
            <div class="preview-error" id="errorIndicator" style="display: none;">
                <p id="errorMessage"></p>
            </div>
        </div>
    </div>
    
    <script src="preview.js"></script>
</body>
</html>
