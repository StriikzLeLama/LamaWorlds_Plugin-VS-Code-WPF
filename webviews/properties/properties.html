<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="properties.css">
</head>

<body>
    <div class="properties-container">
        <div class="header">
            <h2>Properties</h2>
            <div id="elementTag" style="font-size: 10px; color: var(--text-muted);">No Selection</div>
        </div>

        <div id="emptyState" class="empty-state">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                <line x1="9" y1="3" x2="9" y2="21"></line>
            </svg>
            <p>Select an element in the Visual Tree or Preview to inspect its properties.</p>
        </div>

        <div id="propertiesContent" class="content" style="display: none;">
            <div class="section">
                <div class="section-title">Common</div>
                <div class="property-row">
                    <span class="property-label">Name</span>
                    <div class="property-value">
                        <input type="text" id="prop-Name" placeholder="x:Name">
                    </div>
                </div>
                <div class="property-row">
                    <span class="property-label">Type</span>
                    <div class="property-value">
                        <input type="text" id="prop-Type" readonly style="opacity: 0.6;">
                    </div>
                </div>
            </div>

            <div class="section">
                <div class="section-title">Layout</div>
                <div class="property-row">
                    <span class="property-label">Width</span>
                    <div class="property-value">
                        <input type="text" id="prop-Width" placeholder="Auto">
                    </div>
                </div>
                <div class="property-row">
                    <span class="property-label">Height</span>
                    <div class="property-value">
                        <input type="text" id="prop-Height" placeholder="Auto">
                    </div>
                </div>
                <div class="property-row">
                    <span class="property-label">Margin</span>
                    <div class="property-value">
                        <input type="text" id="prop-Margin" placeholder="0,0,0,0">
                    </div>
                </div>
                <div class="property-row">
                    <span class="property-label">Horizontal</span>
                    <div class="property-value">
                        <select id="prop-HorizontalAlignment">
                            <option value="Left">Left</option>
                            <option value="Center">Center</option>
                            <option value="Right">Right</option>
                            <option value="Stretch">Stretch</option>
                        </select>
                    </div>
                </div>
                <div class="property-row">
                    <span class="property-label">Vertical</span>
                    <div class="property-value">
                        <select id="prop-VerticalAlignment">
                            <option value="Top">Top</option>
                            <option value="Center">Center</option>
                            <option value="Bottom">Bottom</option>
                            <option value="Stretch">Stretch</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="section">
                <div class="section-title">Appearance</div>
                <div class="property-row">
                    <span class="property-label">Visibility</span>
                    <div class="property-value">
                        <select id="prop-Visibility">
                            <option value="Visible">Visible</option>
                            <option value="Hidden">Hidden</option>
                            <option value="Collapsed">Collapsed</option>
                        </select>
                    </div>
                </div>
                <div class="property-row">
                    <span class="property-label">Opacity</span>
                    <div class="property-value">
                        <input type="range" id="prop-Opacity" min="0" max="1" step="0.1" style="width: 100%;">
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="properties.js"></script>
</body>

</html>
